[package]
name = "postman2drill"
version = "0.1.0"
edition = "2024"
description = "Convert Postman Collection v2.1 to Drill benchmark YAML"
license = "GPL-3.0"
repository = "https://github.com/sgmovea2z/drill"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.6", features = ["derive", "cargo"] }
jsonpath_lib = "0.3"
regex = "1.12"
thiserror = "2.0"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.27"